<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Creative Studio | SUBBHU AI LABS</title>
  <link rel="stylesheet" href="css/style.css?v=75.0">
  <link rel="stylesheet" href="css/animations.css?v=75.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js?v=75.0"></script>
  <style>
    .studio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 16px 16px 90px 16px;
    }
    .tool-card {
      background: rgba(13, 20, 39, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .tool-thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }
    .tool-info {
      padding: 10px;
    }
    .tool-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      color: #00f2fe;
      background: rgba(0, 242, 254, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .modal-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0d1427;
      border-top: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      display: none;
      z-index: 1000;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <header class="app-header glass">
    <div class="brand-wrap">
      <a href="index.html" style="color: #fff; text-decoration: none; font-size: 1.2rem;">←</a>
      <div class="brand-name">CREATIVE STUDIO</div>
    </div>
    <span class="hero-badge">⚡ 6 Tools Active</span>
  </header>

  <div class="studio-grid">
    <!-- Tool 1 -->
    <div class="tool-card" onclick="openToolModal('Anime Cel-Shaded', 'Stylize', 'Makoto Shinkai style anime cel-shaded character, vibrant colors, studio ghibli anime portrait, 8k')">
      <img class="tool-thumb" src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400&q=80">
      <div class="tool-info">
        <span class="tool-badge">Stylize</span>
        <div style="font-size: 0.82rem; font-weight: 700; color: #fff;">Anime Cel-Shaded</div>
      </div>
    </div>

    <!-- Tool 2 -->
    <div class="tool-card" onclick="openToolModal('DSLR Photorealism', 'Enhance', 'ultra-realistic candid portrait, authentic skin pores, 85mm f1.8 lens bokeh, crisp eyes, natural daylight')">
      <img class="tool-thumb" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&q=80">
      <div class="tool-info">
        <span class="tool-badge">Enhance</span>
        <div style="font-size: 0.82rem; font-weight: 700; color: #fff;">DSLR Portrait</div>
      </div>
    </div>

    <!-- Tool 3 -->
    <div class="tool-card" onclick="openToolModal('Cyberpunk Neon', 'FX', 'cyberpunk portrait, neon cyan magenta rim lighting, dark rain street reflections, futuristic octane render')">
      <img class="tool-thumb" src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&q=80">
      <div class="tool-info">
        <span class="tool-badge">FX</span>
        <div style="font-size: 0.82rem; font-weight: 700; color: #fff;">Cyberpunk Neon</div>
      </div>
    </div>

    <!-- Tool 4 -->
    <div class="tool-card" onclick="openToolModal('3D Pixar Render', 'Animation', 'cute 3D animated character portrait, pixar style, disney lighting, unreal engine 5 render, raytraced')">
      <img class="tool-thumb" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&q=80">
      <div class="tool-info">
        <span class="tool-badge">3D Render</span>
        <div style="font-size: 0.82rem; font-weight: 700; color: #fff;">3D Character</div>
      </div>
    </div>

    <!-- Tool 5 -->
    <div class="tool-card" onclick="openToolModal('Vintage 35mm Film', 'Retro', 'vintage 1990s 35mm kodak portra photograph, warm film grain, retro aesthetic, authentic nostagia')">
      <img class="tool-thumb" src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80">
      <div class="tool-info">
        <span class="tool-badge">Retro</span>
        <div style="font-size: 0.82rem; font-weight: 700; color: #fff;">Vintage Film</div>
      </div>
    </div>

    <!-- Tool 6 -->
    <div class="tool-card" onclick="openToolModal('Commercial Product', 'Ads', 'commercial product advertising shot, pristine reflection, studio lighting, hyperrealistic 8k')">
      <img class="tool-thumb" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80">
      <div class="tool-info">
        <span class="tool-badge">Commercial</span>
        <div style="font-size: 0.82rem; font-weight: 700; color: #fff;">Product Studio</div>
      </div>
    </div>
  </div>

  <!-- Bottom Sheet Modal -->
  <div id="actionModal" class="modal-sheet">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <div>
        <div id="modalTitle" style="font-size: 1.1rem; font-weight: 800; color: #fff;">Tool Name</div>
        <span id="modalBadge" class="tool-badge">Category</span>
      </div>
      <button onclick="closeToolModal()" style="background: none; border: none; color: #94a3b8; font-size: 1.4rem;">✕</button>
    </div>

    <div style="margin: 12px 0;">
      <label style="font-size: 0.75rem; color: #94a3b8; font-weight: 700;">Subject Description (Optional):</label>
      <input id="subjectInput" type="text" placeholder="e.g. young woman with camera / sports bike" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,242,254,0.25); border-radius: 8px; color: #fff; margin-top: 6px; outline: none; box-sizing: border-box;">
    </div>

    <button id="processBtn" class="btn-primary" onclick="executeTool()" style="width: 100%; padding: 12px; border-radius: 10px; font-weight: 700;">
      PROCESS NOW
    </button>

    <!-- Result preview -->
    <div id="modalLoader" style="display: none; text-align: center; margin-top: 14px; color: #00f2fe; font-size: 0.85rem; font-weight: 700;">
      ⚡ Processing with Neural Model...
    </div>

    <div id="toolResultCard" style="display: none; margin-top: 14px;">
      <img id="toolResultImg" src="" style="width: 100%; max-height: 280px; object-fit: cover; border-radius: 10px; border: 1px solid #00f2fe;">
      <a id="toolDownloadBtn" href="#" download="subbhu_studio.jpg" class="btn-primary" style="display: block; text-align: center; text-decoration: none; padding: 10px; margin-top: 8px; border-radius: 8px;">
        💾 SAVE IMAGE
      </a>
    </div>
  </div>

  <nav class="bottom-nav glass">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="create.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>Create</span>
    </a>
    <a href="studio.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
      <span>Studio</span>
    </a>
    <a href="history.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <span>History</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    let activeToolStyle = '';

    function openToolModal(title, badge, stylePrompt) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBadge').innerText = badge;
      activeToolStyle = stylePrompt;
      document.getElementById('toolResultCard').style.display = 'none';
      document.getElementById('actionModal').style.display = 'block';
    }

    function closeToolModal() {
      document.getElementById('actionModal').style.display = 'none';
    }

    async function executeTool() {
      const subject = document.getElementById('subjectInput').value.trim() || "portrait person";
      const fullPrompt = `${subject}, ${activeToolStyle}`;
      const btn = document.getElementById('processBtn');
      const loader = document.getElementById('modalLoader');
      const resCard = document.getElementById('toolResultCard');
      const img = document.getElementById('toolResultImg');
      const dl = document.getElementById('toolDownloadBtn');

      btn.disabled = true;
      loader.style.display = 'block';
      resCard.style.display = 'none';

      // Safe Credit Deduction RPC call
      try {
        if (window.sbClient) {
          const { data: { session } } = await window.sbClient.auth.getSession();
          if (session && session.user) {
            await window.sbClient.rpc('deduct_credits_atomic', {
              p_user_id: session.user.id,
              p_amount: 5,
              p_description: `Used ${document.getElementById('modalTitle').innerText}`
            });
          }
        }
      } catch (e) {
        console.warn('Credits bypassed safely:', e);
      }

      const seed = Math.floor(Math.random() * 999999);
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=1024&height=1024&seed=${seed}&model=flux&nologo=true`;

      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);
        img.src = objUrl;
        dl.href = objUrl;
      } catch (err) {
        img.src = url;
        dl.href = url;
      } finally {
        loader.style.display = 'none';
        resCard.style.display = 'block';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
