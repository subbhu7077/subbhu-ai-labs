<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Creative Studio | SUBBHU AI LABS</title>
  <link rel="stylesheet" href="css/style.css?v=71.0">
  <link rel="stylesheet" href="css/animations.css?v=71.0">
  <style>
    .studio-container {
      padding: 16px 18px 90px 18px;
    }
    .prompt-box {
      width: 100%;
      min-height: 105px;
      background: rgba(13, 20, 39, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 14px;
      padding: 12px;
      color: #fff;
      font-size: 0.85rem;
      resize: none;
      outline: none;
      box-sizing: border-box;
      margin-top: 8px;
    }
    .prompt-box:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.3);
    }
    .presets-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 10px 0 14px 0;
    }
    .presets-row::-webkit-scrollbar { display: none; }
    .preset-chip {
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .ratio-pills {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .ratio-btn {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .ratio-btn.active {
      border-color: #00f2fe;
      color: #00f2fe;
      background: rgba(0, 242, 254, 0.12);
    }
    .result-card {
      margin-top: 16px;
      background: rgba(13, 20, 39, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 16px;
      overflow: hidden;
      display: none;
    }
    .result-img {
      width: 100%;
      display: block;
      object-fit: cover;
      max-height: 480px;
    }
  </style>
</head>
<body>

  <header class="app-header glass">
    <div class="brand-wrap">
      <a href="index.html" style="color: #fff; text-decoration: none; font-size: 1.2rem;">←</a>
      <div class="brand-name">AI CREATIVE STUDIO</div>
    </div>
    <span class="hero-badge">⚡ Realism FLUX</span>
  </header>

  <div class="studio-container">
    <div style="font-size: 0.88rem; font-weight: 800; color: #fff;">Prompt Engine</div>
    <textarea id="promptInput" class="prompt-box" placeholder="Describe the scene (e.g. Authentic portrait photograph of a young woman, real skin texture, shot on 85mm lens, natural daylight)"></textarea>

    <!-- Style presets -->
    <div class="presets-row">
      <div class="preset-chip" onclick="applyPreset('Real Portrait', 'Ultra-realistic candid portrait photograph, highly detailed natural skin texture, visible pores, subtle imperfections, 85mm lens f/1.8, bokeh, studio lighting')">📸 Real Portrait</div>
      <div class="preset-chip" onclick="applyPreset('Cinematic', 'Cinematic 35mm film still, photorealistic, dramatic lighting, detailed face, award-winning photography')">🎬 Cinematic</div>
      <div class="preset-chip" onclick="applyPreset('Cyberpunk', 'Cyberpunk street scene at night, neon reflections on wet street, authentic DSLR shot')">🌆 Cyberpunk</div>
      <div class="preset-chip" onclick="applyPreset('Product Ad', 'Luxury commercial product shot on stone podium, natural light, 8k crisp details')">🧴 Product Ad</div>
    </div>

    <!-- Aspect ratio selection -->
    <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">Aspect Ratio</div>
    <div class="ratio-pills">
      <div class="ratio-btn active" onclick="setRatio('1:1', this)">1:1 Square</div>
      <div class="ratio-btn" onclick="setRatio('9:16', this)">9:16 Portrait</div>
      <div class="ratio-btn" onclick="setRatio('16:9', this)">16:9 Wide</div>
    </div>

    <!-- Generate Button -->
    <button id="generateBtn" class="btn-primary" style="width: 100%; padding: 14px; font-size: 0.92rem; border-radius: 12px; margin-top: 4px;">
      ⚡ GENERATE CREATIVE
    </button>

    <!-- Neon Loader -->
    <div id="genLoader" class="neon-loader-card" style="display: none; padding: 14px; margin-top: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 10px; height: 10px; border-radius: 50%; background: #00f2fe; box-shadow: 0 0 10px #00f2fe;"></div>
          <span style="font-size: 0.82rem; font-weight: 700; color: #fff;">Rendering Real Photo...</span>
        </div>
        <span style="font-size: 0.8rem; font-weight: 800; color: #00d2ff;">FLUX Engine</span>
      </div>
      <div class="neon-stream-bar"></div>
    </div>

    <!-- Result Artwork Card -->
    <div id="resultCard" class="result-card">
      <img id="resultImage" class="result-img" src="" alt="AI Output">
      <div style="padding: 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.75rem; font-weight: 700; color: #00f2fe;">Ultra HD Render</span>
          <span style="font-size: 0.7rem; color: var(--text-muted);">Realism AI</span>
        </div>
        <a id="saveImageBtn" href="#" download="subbhu_realistic.jpg" class="btn-primary neon-download-btn" style="text-align: center; text-decoration: none; padding: 12px; border-radius: 10px;">
          💾 SAVE TO DEVICE
        </a>
      </div>
    </div>
  </div>

  <nav class="bottom-nav glass">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="create.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>Create</span>
    </a>
    <a href="studio.html" class="nav-item" style="color: #00f2fe;">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
      <span>Studio</span>
    </a>
    <a href="history.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <span>History</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    let currentDimensions = { width: 1024, height: 1024 };

    function setRatio(ratio, btn) {
      document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (ratio === '1:1') currentDimensions = { width: 1024, height: 1024 };
      if (ratio === '9:16') currentDimensions = { width: 768, height: 1344 };
      if (ratio === '16:9') currentDimensions = { width: 1344, height: 768 };
    }

    function applyPreset(name, promptText) {
      const ta = document.getElementById('promptInput');
      ta.value = promptText;
      ta.focus();
    }

    document.getElementById('generateBtn').addEventListener('click', async () => {
      const promptInput = document.getElementById('promptInput');
      let userPrompt = promptInput.value.trim();
      if (!userPrompt) {
        promptInput.focus();
        return;
      }

      const btn = document.getElementById('generateBtn');
      const loader = document.getElementById('genLoader');
      const card = document.getElementById('resultCard');
      const img = document.getElementById('resultImage');
      const downloadBtn = document.getElementById('saveImageBtn');

      btn.disabled = true;
      loader.style.display = 'block';
      card.style.display = 'none';

      // Photorealism booster tokens
      const refinedPrompt = `${userPrompt}, authentic dslr photo, high resolution 35mm film portrait, natural skin texture, visible fine pores, soft natural lighting, hyperrealistic, sharp focus, 8k`;
      const seed = Math.floor(Math.random() * 1000000);
      const encoded = encodeURIComponent(refinedPrompt);
      const imageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=${currentDimensions.width}&height=${currentDimensions.height}&seed=${seed}&model=flux&nologo=true`;

      try {
        const res = await fetch(imageUrl);
        const contentType = res.headers.get("content-type");
        
        // Ensure we got an image, not an error text/json
        if (contentType && contentType.includes("application/json")) {
          throw new Error("Model rate limit, retrying direct...");
        }

        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);

        img.src = objUrl;
        downloadBtn.href = objUrl;
        downloadBtn.download = `subbhu_real_${Date.now()}.jpg`;

        loader.style.display = 'none';
        card.style.display = 'block';
      } catch (err) {
        // Direct image fallback
        img.src = imageUrl;
        downloadBtn.href = imageUrl;
        downloadBtn.target = "_blank";
        loader.style.display = 'none';
        card.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
