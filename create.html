<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creation Studio | SUBBHU AI LABS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="app-header glass">
    <div class="brand-wrap">
      <a href="index.html" class="btn-icon" style="margin-right: 8px;">←</a>
      <div class="brand-name">AI Creative Studio</div>
    </div>
  </header>

  <main style="padding: 16px;">
    <!-- Studio Workflow Card -->
    <div class="glass-elevated" style="padding: 16px; border-radius: var(--radius-lg); margin-bottom: 16px;">
      <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 6px;">Prompt Engine</div>
      <textarea id="promptInput" placeholder="Describe the image or video scene (e.g. Cinematic product ad of luxury perfume bottle on wet black obsidian rock, neon cyan rim lights, 8k render...)" style="width: 100%; height: 90px; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-glass); background: rgba(0,0,0,0.5); color: #fff; font-size: 0.8rem; margin-bottom: 12px; resize: none;"></textarea>

      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('promptInput').value='Cyberpunk cityscape at rainy midnight, volumetric neon lights, photorealistic 8K render'" style="font-size: 0.7rem; padding: 6px 8px;">🌆 Cyberpunk</button>
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('promptInput').value='Minimalist luxury skincare serum bottle, studio softbox illumination, macro lens shot'" style="font-size: 0.7rem; padding: 6px 8px;">🧴 Product Ad</button>
      </div>

      <button id="generateCreativeBtn" class="btn btn-primary" style="width: 100%;">⚡ GENERATE CREATIVE</button>
    </div>

    <!-- Output Display Panel -->
    <div id="creativeResultBox" class="glass" style="padding: 16px; border-radius: var(--radius-md); display: none;">
      <div style="font-size: 0.85rem; font-weight: 700; margin-bottom: 8px;">Generation Result</div>
      <div id="creativeNotice" style="font-size: 0.75rem; color: #f59e0b;"></div>
    </div>
  </main>

  <nav class="bottom-nav glass">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="create.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      <span>Create</span>
    </a>
    <div class="nav-fab-wrap">
      <a href="create.html" class="nav-fab">✨</a>
    </div>
    <a href="history.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <span>History</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById('generateCreativeBtn').addEventListener('click', async () => {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) {
        alert("Please enter a prompt description.");
        return;
      }

      const user = await window.BackendAPI.getUser();
      if (!user) {
        alert("Please sign in first via Profile.");
        window.location.href = "login.html";
        return;
      }

      try {
        const genRes = await window.BackendAPI.startGeneration('text2img', `prompt://${encodeURIComponent(prompt)}`);
        const resultBox = document.getElementById('creativeResultBox');
        const notice = document.getElementById('creativeNotice');
        resultBox.style.display = 'block';
        notice.innerHTML = `✅ Generation task queued (ID: ${genRes.generation_id.substring(0,8)}...).<br>AI Provider: NOT CONFIGURED. Backend keys required for raw inference weights.`;
        alert(`Job queued! Credits remaining: ${genRes.remaining_credits}\nAI Provider: NOT CONFIGURED.`);
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
