<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUBBHU BHAI | AI NEURAL LABS</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap");

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #040711;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      padding-bottom: 95px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* 3D Cyber Wallpaper Background */
    .bg-wallpaper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('subbhu_dp.jpg');
      background-size: cover;
      background-position: center top;
      opacity: 0.28;
      filter: blur(1.5px) saturate(1.4);
      transform: scale(1.04);
      z-index: -2;
      animation: wallpaperBreath 10s ease-in-out infinite alternate;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(0, 242, 254, 0.12) 0%, rgba(4, 7, 17, 0.88) 75%);
      z-index: -1;
    }

    @keyframes wallpaperBreath {
      0% { transform: scale(1.02) translateY(0px); }
      100% { transform: scale(1.08) translateY(-10px); }
    }

    /* Header */
    .app-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 14, 28, 0.75);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 242, 254, 0.3);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dp-avatar-header {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #00f2fe;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.7);
      object-fit: cover;
      object-position: top;
      cursor: pointer;
    }

    .subbhu-neon-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00f2fe 0%, #ffffff 25%, #ff007f 50%, #00f2fe 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    /* 3D Floating Hero Showcase Card */
    .hero-showcase {
      margin: 16px 16px 10px 16px;
      background: rgba(13, 22, 45, 0.75);
      border: 1.5px solid rgba(0, 242, 254, 0.4);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.15);
      backdrop-filter: blur(12px);
    }

    .hero-thumb {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2.5px solid #ff007f;
      box-shadow: 0 0 18px rgba(255, 0, 127, 0.7);
      object-fit: cover;
      object-position: top;
    }

    /* Tools Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px 16px;
    }

    .card-3d {
      background: rgba(14, 23, 46, 0.8);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .card-3d:active { border-color: #ff007f; transform: scale(0.97); }

    .card-media { width: 100%; height: 115px; object-fit: cover; display: block; }
    .card-body { padding: 10px; }
    .card-title { font-size: 0.85rem; font-weight: 700; font-family: 'Orbitron', sans-serif; color: #fff; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(7, 12, 24, 0.95);
      border-top: 1px solid rgba(0, 242, 254, 0.25);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      gap: 4px;
    }
    .nav-btn.active { color: #00f2fe; }
    .icon-cube {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn.active .icon-cube {
      background: linear-gradient(135deg, #00f2fe, #ff007f);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
      color: #040711;
    }
  </style>
</head>
<body>

  <!-- Dynamic Cyber Wallpaper Layer -->
  <div class="bg-wallpaper"></div>
  <div class="bg-overlay"></div>

  <!-- Header with Avatar DP -->
  <header class="app-header">
    <div class="brand-box" onclick="window.location.href='wallpaper.html'">
      <img class="dp-avatar-header" src="subbhu_dp.jpg" alt="DP" onerror="this.src='IMG_1324.jpg'">
      <div class="subbhu-neon-title">SUBBHU BHAI</div>
    </div>
    <div style="background: rgba(0, 242, 254, 0.1); border: 1px solid #00f2fe; border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; font-weight: 700; color: #00f2fe; font-family: 'Orbitron', sans-serif;">
      ⚡ 9950 CR
    </div>
  </header>

  <!-- Hero Banner -->
  <div class="hero-showcase" onclick="window.location.href='wallpaper.html'">
    <img class="hero-thumb" src="subbhu_dp.jpg" alt="Subbhu Bhai" onerror="this.src='IMG_1324.jpg'">
    <div>
      <div style="font-size: 0.72rem; color: #00f2fe; font-family: 'Orbitron', sans-serif; font-weight: 800;">OFFICIAL CYBER WALLPAPER</div>
      <div style="font-size: 1.1rem; font-weight: 900; font-family: 'Orbitron', sans-serif; margin-top: 2px;">SUBBHU BHAI THEME</div>
      <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 2px;">Tap to view & save full resolution →</div>
    </div>
  </div>

  <!-- Tools Preview Grid -->
  <div class="grid-container">
    <div class="card-3d" onclick="window.location.href='create.html'">
      <img class="card-media" src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400&q=80">
      <div class="card-body">
        <div class="card-title">4K Upscaler</div>
        <div style="font-size: 0.72rem; color:#00f2fe; margin-top: 4px;">LAUNCH →</div>
      </div>
    </div>
    <div class="card-3d" onclick="window.location.href='create.html'">
      <img class="card-media" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80">
      <div class="card-body">
        <div class="card-title">DSLR Portrait</div>
        <div style="font-size: 0.72rem; color:#00f2fe; margin-top: 4px;">LAUNCH →</div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-btn active">
      <div class="icon-cube">⚡</div>
      <span>Home</span>
    </a>
    <a href="create.html" class="nav-btn">
      <div class="icon-cube">🎨</div>
      <span>Create</span>
    </a>
    <a href="wallpaper.html" class="nav-btn">
      <div class="icon-cube">🖼️</div>
      <span>Wallpaper</span>
    </a>
    <a href="profile.html" class="nav-btn">
      <div class="icon-cube">👤</div>
      <span>Profile</span>
    </a>
  </nav>

</body>
</html>
