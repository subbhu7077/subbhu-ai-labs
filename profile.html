<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUBBHU BHAI | Official Profile</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap");

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040711;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      padding-bottom: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 20%, rgba(0, 242, 254, 0.15), transparent 70%);
    }

    /* 3D Floating & Glowing Neon DP Frame */
    @keyframes dpFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes ringGlow {
      0% { box-shadow: 0 0 15px #00f2fe, 0 0 30px rgba(0, 242, 254, 0.4); border-color: #00f2fe; }
      50% { box-shadow: 0 0 30px #ff007f, 0 0 50px rgba(255, 0, 127, 0.6); border-color: #ff007f; }
      100% { box-shadow: 0 0 15px #00f2fe, 0 0 30px rgba(0, 242, 254, 0.4); border-color: #00f2fe; }
    }

    .dp-container {
      margin-top: 40px;
      position: relative;
      animation: dpFloat 4s ease-in-out infinite;
    }

    .dp-frame {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      padding: 5px;
      border: 3px solid #00f2fe;
      animation: ringGlow 3s ease-in-out infinite alternate;
      background: linear-gradient(135deg, rgba(0,242,254,0.2), rgba(255,0,127,0.2));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .creator-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      margin-top: 18px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00f2fe, #ff007f);
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(0,242,254,0.6));
    }

    .badge-sub {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #00f2fe;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid #00f2fe;
      padding: 4px 14px;
      border-radius: 20px;
      margin-top: 6px;
      box-shadow: 0 0 10px rgba(0,242,254,0.3);
    }

    .action-card {
      width: 88%;
      max-width: 380px;
      background: rgba(13, 22, 45, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 18px;
      padding: 20px;
      margin-top: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      text-align: center;
    }

    .btn-save {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f2fe, #ff007f);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.85rem;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
      cursor: pointer;
      margin-top: 14px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(7, 12, 24, 0.95);
      border-top: 1px solid rgba(0, 242, 254, 0.25);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      gap: 4px;
    }
    .nav-btn.active { color: #00f2fe; }
  </style>
</head>
<body>

  <!-- DP Frame -->
  <div class="dp-container">
    <div class="dp-frame">
      <img class="dp-img" src="subbhu_dp.jpg" alt="SUBBHU BHAI" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80'">
    </div>
  </div>

  <div class="creator-title">👑 SUBBHU BHAI</div>
  <div class="badge-sub">FOUNDER & CHIEF ARCHITECT</div>

  <!-- Save & Stats Card -->
  <div class="action-card">
    <div style="font-size: 0.9rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px;">Official Profile Artwork</div>
    <div style="font-size: 0.75rem; color: #94a3b8; line-height: 1.4;">
      Authentic cinematic outdoor portrait with natural daylight lens blur.
    </div>

    <a href="subbhu_dp.jpg" download="subbhu_bhai_original.jpg" class="btn-save">
      💾 SAVE HD PHOTO
    </a>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-btn"><span>Home</span></a>
    <a href="create.html" class="nav-btn"><span>Create</span></a>
    <a href="dubbing.html" class="nav-btn"><span>Dubbing</span></a>
    <a href="profile.html" class="nav-btn active"><span>Profile</span></a>
  </nav>

</body>
</html>
