<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | SUBBHU AI LABS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <header class="app-header glass">
    <div class="brand-wrap">
      <a href="index.html" class="btn-icon" style="margin-right: 8px;">←</a>
      <div class="brand-name">Profile & Settings</div>
    </div>
  </header>

  <main style="padding: 16px;">
    <!-- Profile Card -->
    <div class="glass-elevated" style="padding: 20px; border-radius: var(--radius-lg); display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
      <div style="width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple)); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: bold; color: #040817;">
        U
      </div>
      <div>
        <div style="font-size: 1.1rem; font-weight: 700;">AI Creator</div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Guest Session (Unlinked)</div>
      </div>
    </div>

    <!-- Tier Card -->
    <div class="glass" style="padding: 16px; border-radius: var(--radius-md); margin-bottom: 16px; border-color: var(--border-highlight);">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <span style="font-size: 0.85rem; font-weight: 600;">Available Fast Credits</span>
        <span style="font-size: 0.85rem; color: var(--primary-cyan); font-weight: 700;">50 / 50</span>
      </div>
      <div style="height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden;">
        <div style="width: 100%; height: 100%; background: var(--primary-cyan);"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <a href="login.html" class="btn btn-secondary" style="justify-content: flex-start;">🔐 Sign In / Sync Account</a>
      <button class="btn btn-secondary" style="justify-content: flex-start;" onclick="alert('Part 2 feature')">⚙️ Processing Preferences</button>
      <button class="btn btn-secondary" style="justify-content: flex-start;" onclick="alert('Part 2 feature')">🌐 API Configuration</button>
    </div>
  </main>

  <nav class="bottom-nav glass">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="create.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      <span>Create</span>
    </a>
    <div class="nav-fab-wrap">
      <a href="create.html" class="nav-fab">✨</a>
    </div>
    <a href="history.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <span>History</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </a>
  </nav>
</body>
</html>
